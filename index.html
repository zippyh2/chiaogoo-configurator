<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChiaoGoo Needle Configurator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f9f9f9; color: #333; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; max-width: 450px; width: 100%; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; color: #111; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; background-color: #fff; margin-bottom: 10px; }
        .alert { padding: 12px; border-radius: 8px; font-size: 14px; margin-top: 15px; display: none; line-height: 1.4; }
        .success { background-color: #e6f4ea; color: #137333; border: 1px solid #ceead6; display: block; }
        .warning { background-color: #fef7e0; color: #b06000; border: 1px solid #feefc3; }
        .error { background-color: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
        button { width: 100%; background-color: #ff4b4b; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
        button:hover { background-color: #e03e3e; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="card">
    <h1>🧶 ChiaoGoo Configurator</h1>
    <p style="font-size: 14px; color: #666; text-align: center; margin-top: -10px;">The Little Knitting Company</p>
    
    <label for="tipSelect">1. Choose Your Needle Tip Diameter:</label>
    <select id="tipSelect" onchange="checkCompatibility()">
        <option value="6523146109270" data-group="Mini">1.5mm [M]</option>
        <option value="6523146240342" data-group="Mini">2.5mm [M]</option>
        <option value="6523146371414" data-group="Small">3.5mm [S]</option>
        <option value="6523146502486" data-group="Small" selected>5.0mm [S]</option>
        <option value="6523146535254" data-group="Large">5.5mm [L]</option>
        <option value="6523146764630" data-group="Large">10.0mm [L]</option>
    </select>

    <label for="cableSelect">2. Choose Your Cable Style & Length:</label>
    <select id="cableSelect" onchange="checkCompatibility()">
        <option value="6523138670934" data-group="Mini">14in TWIST Red (Mini)</option>
        <option value="6523138834774" data-group="Small" selected>14in TWIST Red (Small)</option>
        <option value="6523139031382" data-group="Large">14in TWIST Red (Large)</option>
        <option value="6523137786198" data-group="Small">14in SWIV360 Silver (Small)</option>
        <option value="6523138081110" data-group="Large">14in SWIV360 Silver (Large)</option>
    </select>

    <div id="statusAlert" class="alert success">✅ Perfect Match! Both items belong to the same ChiaoGoo ecosystem.</div>

    <button id="checkoutBtn" onclick="goToCheckout()">🛒 Send Complete Set to Shop Cart</button>
</div>

<script>
    // Database for adapters
    const adapters = {
        "Small_to_Mini": "6523146994006",
        "Large_to_Small": "6523146961238"
    };

    let calculatedUrl = "";

    function checkCompatibility() {
        const tipElement = document.getElementById("tipSelect");
        const cableElement = document.getElementById("cableSelect");
        
        const tipGroup = tipElement.options[tipElement.selectedIndex].getAttribute("data-group");
        const tipId = tipElement.value;
        
        const cableGroup = cableElement.options[cableElement.selectedIndex].getAttribute("data-group");
        const cableId = cableElement.value;
        
        const alertBox = document.getElementById("statusAlert");
        const btn = document.getElementById("checkoutBtn");
        
        let variants = [`${tipId}:1`, `${cableId}:1`];
        btn.disabled = false;
        alertBox.className = "alert"; // Reset styles

        if (tipGroup === cableGroup) {
            alertBox.innerText = `✅ Perfect Match! Both items belong to the ChiaoGoo '${tipGroup}' ecosystem.`;
            alertBox.classList.add("success");
        } else if (tipGroup === "Small" && cableGroup === "Mini") {
            alertBox.innerText = `💡 Notice: You matched a Small Tip with a Mini Cable. We've automatically added a 'Small Tip to Mini Cable Adapter' so they fit seamlessly!`;
            alertBox.classList.add("warning");
            variants.push(`${adapters.Small_to_Mini}:1`);
        } else if (tipGroup === "Large" && cableGroup === "Small") {
            alertBox.innerText = `💡 Notice: You matched a Large Tip with a Small Cable. We've automatically added a 'Large Tip to Small Cable Adapter' so they fit seamlessly!`;
            alertBox.classList.add("warning");
            variants.push(`${adapters.Large_to_Small}:1`);
        } else {
            alertBox.innerText = `⚠️ Incompatible: There is no standard adapter available to connect a ${tipGroup} Tip to a ${cableGroup} Cable.`;
            alertBox.classList.add("error");
            btn.disabled = true;
            return;
        }

        calculatedUrl = "https://www.thelittleknittingcompany.co.uk/cart/" + variants.join(",");
    }

    function goToCheckout() {
        // Because we are hosted openly on Netlify, this native location shift cannot be blocked!
        window.location.href = calculatedUrl;
    }

    // Run once at launch
    checkCompatibility();
</script>

</body>
</html>
