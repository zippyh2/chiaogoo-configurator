<!DOCTYPE html>
<html lang="en-GB">
<head>
    <!-- Mobile PWA Core Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KnitConfig">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://shopify.com">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChiaoGoo Interactive Needle Configurator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; color: #333; padding: 20px; display: flex; justify-content: center; }
        .builder-card { background: white; max-width: 550px; width: 100%; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; text-align: center; margin-bottom: 5px; color: #111; }
        .subtitle { text-align: center; font-size: 14px; color: #666; margin-bottom: 25px; }
        .section-title { font-weight: bold; font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 8px; margin-top: 25px; margin-bottom: 15px; color: #222; }
        
        .grid-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .cable-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .option-card { border: 2px solid #ebd; border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .option-card:hover { border-color: #ff4b4b; background-color: #fff9f9; }
        .option-card.selected { border-color: #ff4b4b; background-color: #ffeded; font-weight: bold; }
        .option-card img { width: 100%; max-width: 100px; height: 70px; border-radius: 6px; margin-bottom: 8px; object-fit: cover; background: #fdfdfd; }
        
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; background-color: #fff; margin-bottom: 15px; }
        
        .alert-box { padding: 15px; border-radius: 10px; font-size: 14px; margin-top: 20px; display: none; line-height: 1.5; }
        .success { background-color: #e6f4ea; color: #137333; border: 1px solid #ceead6; display: block; }
        .warning { background-color: #fdf7e0; color: #b06000; border: 1px solid #feefc3; display: block; }
        
        .upsell-container { background: #fdfdfd; border: 1px dashed #ff4b4b; padding: 15px; border-radius: 10px; margin-top: 20px; display: none; align-items: center; gap: 12px; }
        .upsell-container input { width: 20px; height: 20px; cursor: pointer; margin: 0; }
        
        .checkout-btn { width: 100%; background-color: #ff4b4b; color: white; padding: 16px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 25px; box-shadow: 0 4px 12px rgba(255,75,75,0.2); }
        .checkout-btn:hover { background-color: #e03e3e; }
    </style>
</head>
<body>

<div class="builder-card">
    <h1>🧶 ChiaoGoo Custom Configuration Engine</h1>
    <p class="subtitle">The Little Knitting Company</p>

    <!-- STEP 1: NEEDLE TIPS -->
    <div class="section-title">1. Customise Your Needle Tips</div>
    
    <label>Select Needle Tip Material/Style:</label>
    <div class="grid-options">
        <div class="option-card selected" id="style-twist" onclick="selectTipStyle('TWIST')">
            <img src="https://shopify.com" alt="TWIST Stainless Steel">
            <div>TWIST (Steel)</div>
        </div>
        <div class="option-card" id="style-spin" onclick="selectTipStyle('SPIN')">
            <img src="https://shopify.com" alt="SPIN Bamboo">
            <div>SPIN (Bamboo)</div>
        </div>
        <div class="option-card" id="style-forte" onclick="selectTipStyle('Forté')">
            <img src="https://shopify.com" alt="Forté Carbon Fibre">
            <div>Forté (Carbon)</div>
        </div>
    </div>

    <label for="tipLength">Select Needle Tip Length:</label>
    <select id="tipLength" onchange="populateDiameters()"></select>

    <label for="tipDiameter">Select Needle Tip Diameter:</label>
    <select id="tipDiameter" onchange="evaluateSystem()"></select>

    <!-- STEP 2: CABLES -->
    <div class="section-title">2. Choose Your Matching Cable</div>
    
    <label>Select Cable Type:</label>
    <div class="cable-grid">

        </div>

        </div>
    </div>

    <label for="cableLength">Select Cable Length:</label>
    <select id="cableLength" onchange="evaluateSystem()"></select>

    <!-- COMPATIBILITY READOUTS -->
    <div id="compatibilityAlert" class="alert-box success"></div>

    <!-- UPSELL TARGET MAPPING -->
    <div class="upsell-container" id="upsellWrapper">

        </div>
    </div>

    <button class="checkout-btn" onclick="triggerShopifyRedirect()">🛒 Send Selection to Shopping Cart</button>
</div>

       { type: "SPIN Swivel Nylon", length: "30in", id: "50788906959190", conn: "Large" },
       { type: "SPIN Swivel Nylon", length: "37in", id: "50788906991958", conn: "Large" },
       { type: "SPIN Swivel Nylon", length: "50in", id: "50788907024726", conn: "Large" }];
        const ADAPTERS = {
        "Large_to_Small": "50788912955734",
        "Small_to_Mini": "50788912988502"
    };

    const UPSELLS = {
        "Small": "52378839777622",
        "Large": "52378839810390"
    };

    // App state flags
    let activeStyle = "TWIST";
    let activeCableType = "SWIV360";
    let targetLink = "";

    function selectTipStyle(styleName) {
        document.querySelectorAll("[id^='style-']").forEach(el => el.classList.remove('selected'));
        document.getElementById(`style-${styleName.toLowerCase().replace('é','e')}`).classList.add('selected');
        activeStyle = styleName;
        
        // Render out available lengths matching that material catalog
        const lengthMenu = document.getElementById("tipLength");
        let lengths = [...new Set(DB_TIPS.filter(t => t.style === activeStyle).map(t => t.length))];
        
        lengthMenu.innerHTML = lengths.map(l => `<option value="${l}">${l} long</option>`).join("");
        populateDiameters();
    }

    function populateDiameters() {
        const selectedLen = document.getElementById("tipLength").value;
        const diaMenu = document.getElementById("tipDiameter");
        
        let targetTips = DB_TIPS.filter(t => t.style === activeStyle && t.length === selectedLen);
        diaMenu.innerHTML = targetTips.map(t => `<option value="${t.id}" data-conn="${t.conn}">${t.size} [${t.conn} Connector]</option>`).join("");
        
        updateCableLengths();
    }

    function selectCableType(cableTypeName) {
        document.querySelectorAll("[id^='cable-']").forEach(el => el.classList.remove('selected'));
        
        let searchId = "swiv360";
        if(cableTypeName === "Red Lace") searchId = "red";
        if(cableTypeName === "Blue X-Flex") searchId = "blue";
        if(cableTypeName === "SPIN Swivel Nylon") searchId = "spin";
        
        document.getElementById(`cable-${searchId}`).classList.add('selected');
        activeCableType = cableTypeName;
        updateCableLengths();
    }

    function updateCableLengths() {
        const cableLenMenu = document.getElementById("cableLength");
        
        // Pull cables belonging to current selected style category
        let availableCables = DB_CABLES.filter(c => c.type === activeCableType);
        
        cableLenMenu.innerHTML = availableCables.map(c => 
            `<option value="${c.id}" data-conn="${c.conn}">${c.length} (${c.conn} Connector)</option>`
        ).join("");
        
        evaluateSystem();
    }

    // --- 2. LOGIC MATCH ENGINE RULES ---
    function evaluateSystem() {
        const tipEl = document.getElementById("tipDiameter");
        const cableEl = document.getElementById("cableLength");
        
        if(!tipEl.value || !cableEl.value) return;
        
        const tipConn = tipEl.options[tipEl.selectedIndex].getAttribute("data-conn");
        const cableConn = cableEl.options[cableEl.selectedIndex].getAttribute("data-conn");
        
        const alertDiv = document.getElementById("compatibilityAlert");
        const upsellWrapper = document.getElementById("upsellWrapper");
        alertDiv.className = "alert-box"; // Reset states
        
        let cartItems = [`${tipEl.value}:1`, `${cableEl.value}:1`];
        let setupValid = true;

        if (tipConn === cableConn) {
            alertDiv.innerText = `✅ Perfect Combination! Both components run natively on the ChiaoGoo '${tipConn}' platform.`;
            alertDiv.classList.add("success");
        } else if (tipConn === "Large" && cableConn === "Small") {
            alertDiv.innerText = `💡 Mix & Match Configuration: You paired a Large Tip with a Small Cable. A 'Large to Small Adaptor' has been automatically added to make them fit perfectly.`;
            alertDiv.classList.add("warning");
            cartItems.push(`${ADAPTERS.Large_to_Small}:1`);
        } else if (tipConn === "Small" && cableConn === "Mini") {
            alertDiv.innerText = `💡 Mix & Match Configuration: You paired a Small Tip with a Mini Cable. A 'Small to Mini Adaptor' has been automatically added to make them fit perfectly.`;
            alertDiv.classList.add("warning");
            cartItems.push(`${ADAPTERS.Small_to_Mini}:1`);
        } else {
            alertDiv.innerText = `⚠️ Incompatible Choice: There is no standard adaptor pathway to bridge a ${tipConn} tip directly with a ${cableConn} cable size footprint.`;
            alertDiv.classList.add("warning");
            setupValid = false;
        }

        // Handle Dynamic Swivel Upsell Target Rendering
        if(setupValid && UPSELLS[tipConn]) {
            upsellWrapper.style.display = "flex";
            if(document.getElementById("swivelUpsell").checked) {
                cartItems.push(`${UPSELLS[tipConn]}:1`);
            }
        } else {
            upsellWrapper.style.display = "none";
            document.getElementById("swivelUpsell").checked = false;
        }

        targetLink = "https://thelittleknittingcompany.co.uk/cart/" + cartItems.join(",");
    }

    function triggerShopifyRedirect() {
        window.location.href = targetLink;
    }

    // Launch execution matrix sequence
    selectTipStyle("TWIST");
    // Register the PWA service worker asset background layer
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA Service Worker successfully registered!'))
            .catch(err => console.log('Service worker registration failed: ', err));
    });
}

</script>

</body>
</html>
